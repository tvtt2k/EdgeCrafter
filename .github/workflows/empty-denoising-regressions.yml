name: Empty-denoising regressions

# Run only on our development branch; no pull request or main-branch changes required.
on:
  push:
    branches:
      - fix/empty-denoising-edge-cases
    paths:
      - .github/workflows/empty-denoising-regressions.yml
      - ecdetseg/engine/edgecrafter/criterion.py
      - ecdetseg/engine/edgecrafter/decoder.py
      - ecdetseg/tests/test_empty_denoising_regressions.py
      - ecdetseg/tests/test_ecdet_full_train_smoke.py
      - ecdetseg/tools/validation/gpu_train_smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regression-tests:
    name: CPU regression tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-only PyTorch and torchvision
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.6.0" "torchvision==0.21.0" \
            --index-url https://download.pytorch.org/whl/cpu

      # These tests import EdgeCrafter's engine package, so install its
      # lightweight runtime/import dependencies, not CUDA or ONNX tooling.
      - name: Install regression-test dependencies
        run: |
          python -m pip install \
            "numpy==2.0.1" "scipy==1.16.0" pytest \
            PyYAML tensorboard pycocotools calflops 'transformers==4.46.3' opencv-python-headless

      - name: Verify CPU-only runtime
        run: |
          python -c "import torch, torchvision; print('torch:', torch.__version__); print('torchvision:', torchvision.__version__); assert not torch.cuda.is_available()"

      - name: Run empty-denoising regression tests
        working-directory: ecdetseg
        run: python -m pytest -v tests/test_empty_denoising_regressions.py

      - name: Smoke-test real ECDet-S training on CPU
        working-directory: ecdetseg
        timeout-minutes: 15
        run: python -m pytest -v tests/test_ecdet_full_train_smoke.py

      - name: Check GPU validation harness syntax
        run: python -m py_compile ecdetseg/tools/validation/gpu_train_smoke.py

      - name: Test GPU validation harness on CPU
        working-directory: ecdetseg
        timeout-minutes: 5
        run: python tools/validation/gpu_train_smoke.py --mode single --device cpu --precision fp32

      - name: Test distributed validation harness with CPU Gloo
        working-directory: ecdetseg
        timeout-minutes: 5
        env:
          TORCH_DISTRIBUTED_DEBUG: DETAIL
        run: python -m torch.distributed.run --standalone --nproc_per_node=2 tools/validation/gpu_train_smoke.py --mode ddp --device cpu --precision fp32

