name: decoder-no-denoising tests

on:
  push:
    branches:
      - fix/decoder-pred-segs
    paths:
      - .github/workflows/decoder-no-denoising-tests.yml
      - ecdetseg/engine/edgecrafter/decoder.py
      - ecdetseg/tests/test_decoder_no_denoising.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU PyTorch and torchvision
        run: |
          python -m pip install "torch==2.6.0" "torchvision==0.21.0" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install focused test dependencies
        run: |
          python -m pip install "numpy==2.0.1" "scipy==1.16.0" \
            pytest PyYAML tensorboard pycocotools calflops \
            "transformers==4.46.3" opencv-python-headless

      - name: Run unit and actual-model regression tests
        working-directory: ecdetseg
        run: python -m pytest -v tests/test_decoder_no_denoising.py
